name: CI and image delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "helm/**"
      - "README.md"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: azure/setup-helm@v4
      - run: helm lint helm/sokcho-planner && helm template sokcho-planner helm/sokcho-planner > /tmp/rendered.yaml
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kkamji98/sokcho-planner:${{ github.sha }}
      - name: Pin the GitOps chart to the published immutable image
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path("helm/sokcho-planner/values.yaml")
          text = p.read_text()
          text, count = re.subn(r"(?m)^  tag: .*", "  tag: ${{ github.sha }}", text, count=1)
          assert count == 1
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/sokcho-planner/values.yaml
          git diff --cached --quiet || git commit -m "chore(deploy): pin image ${{ github.sha }} [skip ci]"
          git push
