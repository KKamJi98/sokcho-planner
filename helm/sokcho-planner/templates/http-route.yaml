{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sokcho-planner.fullname" . }}
  labels:
    {{- include "sokcho-planner.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.parentRef.name }}
      namespace: {{ .Values.route.parentRef.namespace }}
      sectionName: {{ .Values.route.parentRef.sectionName }}
  hostnames: [{{ .Values.route.host | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "sokcho-planner.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
