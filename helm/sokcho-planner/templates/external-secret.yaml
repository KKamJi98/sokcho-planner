apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sokcho-planner.fullname" . }}-app-env
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.appEnv.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.appEnv.secretStoreRef.name }}
    kind: {{ .Values.appEnv.secretStoreRef.kind }}
  target:
    name: {{ .Values.appEnv.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: PLANNER_PASSWORD
      remoteRef:
        key: {{ .Values.appEnv.passwordSsmKey }}
